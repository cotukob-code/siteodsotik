<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Донаты — DonationAlerts</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #da-wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 12px;
      background: #181818;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <h1>Донаты</h1>
  <div id="da-wrap"></div>

  <script>
    (function () {
      const url = "https://www.donationalerts.com/widget/stream-stats/2289490?token=W965bulACfZiXZ9rJUip";

      const wrap = document.getElementById("da-wrap");
      if (!wrap) return;

      const iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.width = "100%";
      iframe.height = "600";
      iframe.frameBorder = "0";
      iframe.scrolling = "no";
      iframe.style.border = "none";
      iframe.style.borderRadius = "10px";
      iframe.style.overflow = "hidden";

      wrap.appendChild(iframe);
    })();
  </script>

</body>
</html>

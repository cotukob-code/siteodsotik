<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>СайтСотика — Стрим</title>
  <style>
    :root {
      --bg: #050509;
      --bg2: #0b0b12;
      --card: #14141f;
      --accent: #ff9900;
      --accent-soft: rgba(255, 153, 0, 0.18);
      --border: #262637;
      --text: #f5f5f5;
      --muted: #8a8aa0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #181830 0, #050509 55%);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 32px;
      border-bottom: 1px solid #151525;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #050509, #101020);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: radial-gradient(circle at 30% 20%, #fff 0, #ff9900 35%, #ff4b00 80%);
      box-shadow: 0 0 18px rgba(255, 153, 0, 0.7);
    }

    .logo span {
      color: #ffffff;
    }

    nav {
      display: flex;
      gap: 18px;
      font-size: 15px;
    }

    .nav-link {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid transparent;
      transition: 0.18s ease;
    }

    .nav-link:hover {
      color: #fff;
      border-color: #33334a;
      background: rgba(255, 255, 255, 0.02);
    }

    .nav-link.active {
      color: #000;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(255, 153, 0, 0.6);
      font-weight: 600;
    }

    .content {
      flex: 1;
      padding: 28px 32px 40px;
      max-width: 1320px;
      margin: 0 auto;
    }

    .stream-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }

    .stream-title {
      font-size: 28px;
      font-weight: 700;
    }

    .stream-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .stream-badge {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      background: rgba(10, 10, 18, 0.9);
      color: var(--accent);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .stream-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.4fr;
      gap: 20px;
      margin-top: 10px;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: radial-gradient(circle at top left, #1f1f33 0, #14141f 40%, #0b0b12 100%);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 16px 16px 14px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255, 153, 0, 0.12), transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
    }

    .card-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid #2f2f45;
      background: rgba(5, 5, 12, 0.9);
    }

    .card-body {
      position: relative;
      z-index: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      border: none;
      display: block;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .row-2 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 14px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .content {
        padding: 20px 16px 28px;
      }
      .stream-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">
      <div class="logo-mark"></div>
      <span>СайтСотика</span>
    </div>
    <nav>
      <a href="/" class="nav-link">Главная</a>
      <a href="/news" class="nav-link">Новости</a>
      <a href="/auction" class="nav-link">Аукцион</a>
      <a href="/stream" class="nav-link active">Стрим</a>
    </nav>
  </header>

  <main class="content">
    <div class="stream-header">
      <div>
        <div class="stream-title">Стрим‑панель донатов</div>
        <div class="stream-sub">Живые донаты, топы, цели и алерты — всё в одном месте, под СайтСотика.</div>
      </div>
      <div class="stream-badge">
        <span class="stream-badge-dot"></span>
        Стрим онлайн · DonationAlerts
      </div>
    </div>

    <div class="grid">
      <!-- Левая колонка: основные донаты -->
      <div class="col">
        <!-- Последние донаты -->
        <section class="card">
          <div class="card-header">
            <div class="card-title">Последние донаты</div>
            <div class="card-tag">live feed</div>
          </div>
          <div class="card-body">
            <iframe
              src="https://www.donationalerts.com/widget/lastdonations?token=W965bulACfZiXZ9rJUip"
              height="520">
            </iframe>
          </div>
        </section>

        <!-- Список донатов -->
        <section class="card">
          <div class="card-header">
            <div class="card-title">Полный список донатов</div>
            <div class="card-tag">history</div>
          </div>
          <div class="card-body">
            <iframe
              src="https://www.donationalerts.com/widget/donation-list?token=W965bulACfZiXZ9rJUip"
              height="420">
            </iframe>
          </div>
        </section>
      </div>

      <!-- Правая колонка: топы, цель, алерты -->
      <div class="col">
        <!-- Цель + Топ донатеров в 2 колонки -->
        <div class="row-2">
          <section class="card">
            <div class="card-header">
              <div class="card-title">Цель донатов</div>
              <div class="card-tag">goal</div>
            </div>
            <div class="card-body">
              <iframe
                src="https://www.donationalerts.com/widget/goal?token=W965bulACfZiXZ9rJUip"
                height="210">
              </iframe>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div class="card-title">Топ донатеров</div>
              <div class="card-tag">top</div>
            </div>
            <div class="card-body">
              <iframe
                src="https://www.donationalerts.com/widget/top?token=W965bulACfZiXZ9rJUip"
                height="210">
              </iframe>
            </div>
          </section>
        </div>

        <!-- Алерты -->
        <section class="card">
          <div class="card-header">
            <div class="card-title">Алерты стрима</div>
            <div class="card-tag">alerts</div>
          </div>
          <div class="card-body">
            <iframe
              src="https://www.donationalerts.com/widget/alerts?token=W965bulACfZiXZ9rJUip"
              height="260">
            </iframe>
          </div>
        </section>
      </div>
    </div>
  </main>

</div>
</body>
</html>
